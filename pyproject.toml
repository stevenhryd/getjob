[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "getjob"
version = "0.1.0"
description = "Pencari & pelamar kerja otomatis (LinkedIn, JobStreet, Glints, Kalibrr, remote) dengan dashboard web"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.9",
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
    "filelock>=3.13",
    "httpx>=0.27",
    "itsdangerous>=2.1",
    "jinja2>=3.1",
    "playwright>=1.49",
    "pydantic>=2.6",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
getjob = "getjob.cli:main"

[tool.setuptools.packages.find]
include = ["getjob*"]

[tool.setuptools.package-data]
getjob = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
